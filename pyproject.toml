[project]
name = "fraud-detection"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "matheus-araujo", email = "mraraujo@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pandera[pandas]>=0.34.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
fraud-detection = "fraud_detection:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
